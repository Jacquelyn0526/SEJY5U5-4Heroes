<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年级历史单元评估：保卫国土的抗争</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;    /* 经典深蓝灰 */
            --accent-color: #1a5276;     /* 测评规范蓝 */
            --bg-color: #f4f6f9;         /* 试卷背景色 */
            --card-bg: #ffffff;
            --text-color: #2d3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* 顶部看板 */
        .header-banner {
            background: linear-gradient(135deg, var(--primary-color), #111a24);
            color: white;
            padding: 35px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header-banner h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header-banner p {
            margin: 10px 0 15px 0;
            font-size: 15px;
            opacity: 0.8;
        }

        .score-board {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(255, 255, 255, 0.12);
            padding: 10px 25px;
            border-radius: 4px;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* 试卷主容器 */
        .exam-container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px 40px 20px;
        }

        /* 难度分段横幅 */
        .level-title {
            background-color: #e5e8e8;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 40px 0 20px 0;
            border-left: 5px solid var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 题目卡片样式 */
        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-top: 3px solid #bdc3c7;
            transition: all 0.2s ease;
        }

        .quiz-card.answered-correct { border-top-color: #27ae60; background-color: #f4faf6; }
        .quiz-card.answered-wrong { border-top-color: #c0392b; background-color: #fdf4f4; }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #f2f4f4;
            padding-bottom: 10px;
        }

        .quiz-tag {
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        .tts-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tts-btn:hover { text-decoration: underline; }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 18px;
            line-height: 1.6;
            color: #2c3e50;
        }

        /* 领袖图像样式 */
        .leader-img {
            display: block;
            max-width: 180px;
            height: auto;
            margin: 15px 0;
            border: 1px solid #d5dbdb;
            border-radius: 4px;
            padding: 4px;
            background-color: #fff;
        }

        /* 选项布局列表 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background-color: #fdfefe;
            border: 1px solid #d5dbdb;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        .option-item:hover { background-color: #f2f4f4; border-color: #bdc3c7; }
        .option-item input { margin: 0; transform: scale(1.1); cursor: pointer; }

        /* 点击式填空/选择块 */
        .click-gap-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8f9f9;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px dashed #b2babb;
        }
        .click-block {
            padding: 6px 14px;
            background: #fff;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .click-block.selected {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 检查按钮 */
        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #113f5c; }

        /* 实时反馈 */
        .feedback-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }
        .feedback-msg.show-success { display: block; background-color: #e8f8f5; color: #117a65; border: 1px solid #a3e4d7; }
        .feedback-msg.show-error { display: block; background-color: #f9ebea; color: #922b21; border: 1px solid #f5b7b1; }

        /* 页脚声明 */
        .footer {
            text-align: center;
            padding: 30px;
            color: #95a5a6;
            font-size: 13px;
            border-top: 1px solid #e5e8e8;
            background-color: #fff;
        }
    </style>
</head>

                pool: ['巴西沙哇', '加拿大逸', '林茂', '伊根村'],

            // ==================== 进阶题（11-20题） ====================
            {
                id: 11, type: 'MC', section: 2,

            },

            },

        const recordStatus = {}; // 记录每道题的答题状态

        // 渲染评估试卷

            const sec1 = document.getElementById('section-1');

            megaQuizData.forEach((item, index) => {

                            </button>
                        </div>
                        <div class="question-text">${item.q}</div>
                `;

                // 如果该题包含领袖图像配图
                if (item.img) {
                    cardHtml += `<img src="${item.img}" alt="历史领袖" class="leader-img" />`;
                }

                if (item.type === 'TF') {
                    cardHtml += `
                        <div class="options-list">
                            <label class="option-item"><input type="radio" name="ans-${item.id}" value="对"> ○ 正确</label>
                            <label class="option-item"><input type="radio" name="ans-${item.id}" value="错"> × 错误</label>
                        </div>
                    `;
                } else if (item.type === 'MC') {
                    cardHtml += `<div class="options-list">`;
                    item.options.forEach(opt => {
                        cardHtml += `<label class="option-item"><input type="radio" name="ans-${item.id}" value="${opt[0]}"> ${opt}</label>`;
                    });
                    cardHtml += `</div>`;
                } else if (item.type === 'CLICK') {
                    cardHtml += `
                        <div class="click-gap-container" id="gap-box-${item.id}">
                            <input type="hidden" id="hide-ans-${item.id}" value="">
                    `;
                    item.pool.forEach(word => {
                        cardHtml += `<span class="click-block" onclick="selectBlock(${item.id}, this, '${word}')">${word}</span>`;
                    });
                    cardHtml += `</div>`;
                }

                cardHtml += `
                        <button class="action-btn" onclick="verifyResponse(${item.id})">提交核对</button>
                        <div class="feedback-msg" id="msg-${item.id}"></div>
                    </div>
                `;

                if (item.section === 1) sec1.innerHTML += cardHtml;
                else if (item.section === 2) sec2.innerHTML += cardHtml;
                else if (item.section === 3) sec3.innerHTML += cardHtml;
            });
        }

        // 点击选词组件互动
        window.selectBlock = function(id, element, word) {
            const container = document.getElementById(`gap-box-${id}`);
            const blocks = container.getElementsByClassName('click-block');
            for (let b of blocks) {
                b.classList.remove('selected');
            }
            element.classList.add('selected');
            document.getElementById(`hide-ans-${id}`).value = word;
        };

        // 文本语音无障碍朗读
        window.executeSpeech = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('当前浏览器不兼容文本转语音功能。');
            }
        }

        // 答题实时校验引擎与积分同步机制（已完全隐藏Hint提示内容）
        window.verifyResponse = function(id) {
            const quiz = megaQuizData.find(x => x.id === id);
            let userAns = '';

            if (quiz.type === 'TF' || quiz.type === 'MC') {
                const checked = document.querySelector(`input[name="ans-${id}"]:checked`);
                if (checked) userAns = checked.value;
            } else if (quiz.type === 'CLICK') {
                userAns = document.getElementById(`hide-ans-${id}`).value;
            }

            if (!userAns) {
                alert('提示：请先选择或填选该道试题的答案。');
                return;
            }

            const card = document.getElementById(`card-${id}`);
            const feedback = document.getElementById(`msg-${id}`);
            const isCorrect = (userAns === quiz.a);

            if (isCorrect) {
                feedback.innerHTML = `<i class="fa-solid fa-circle-check"></i> <strong>评估反馈：</strong>答案正确。完美掌握该项史实。 [分值 +10]`;
                feedback.className = "feedback-msg show-success";
                card.className = "quiz-card answered-correct";

                if (recordStatus[id] !== 'CORRECT') {
                    totalScore += 10;
                    recordStatus[id] = 'CORRECT';
                    emitBeep(660, 0.1); 
                }
            } else {
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> <strong>评估反馈：</strong>答案有误。请重新研判试题。`;
                feedback.className = "feedback-msg show-error";
                card.className = "quiz-card answered-wrong";

                if (recordStatus[id] !== 'CORRECT') {
                    if (totalScore >= 2) totalScore -= 2; 
                    emitBeep(330, 0.25); 
                }
            }

            document.getElementById('total-score').innerText = totalScore;
        };

        // 电子提示音效果合成器
        function emitBeep(freq, dur) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                osc.start();
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.stop(audioCtx.currentTime + dur);
            } catch (e) {
                console.log('Audio disabled');
            }
        }

        window.onload = buildQuiz;
    </script>
</body>
</html>
